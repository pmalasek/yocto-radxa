# PlutoLinux Distribution Configuration
# Based on Poky (Yocto Project Reference Distro)

require conf/distro/poky.conf

DISTRO = "pluto-linux"
DISTRO_NAME = "Pluto Linux"
DISTRO_VERSION = "1.01"
DISTRO_CODENAME = "pluto"

TARGET_VENDOR = "-pluto"

# Switch init manager from SysVinit to systemd
DISTRO_FEATURES:remove = "sysvinit alsa pam"
DISTRO_FEATURES:append = " systemd wifi bluetooth"
INIT_MANAGER = "systemd"

# Set root password (hash of: ATXGroup.2026)
# Generated with: openssl passwd -6 "ATXGroup.2026"
INHERIT += "extrausers"

# Add admin tooling and users
IMAGE_INSTALL:append = " sudo"

# root password hash generated with: openssl passwd -6 "ATXGroup.2026"
# xsystem password hash generated with: openssl passwd -6 "Pluto9"
# pmalasek password hash generated with: openssl passwd -6 "okinawa"
EXTRA_USERS_PARAMS = " \
	usermod -p '\$6\$wnvRwZ7gwXl8.4.J\$4PgX4Yh4DBvY9ub5gNGs/o1bwZsHKlAU4wStKbLh9ZayW52w79TJ/igEmgtYg5e1dgYf5jeatdQz8F3oRO4Lp/' root; \
	groupadd admins; \
	useradd -m -s /bin/sh -G admins -p '\$6\$sHg7cXBanX.foA7t\$ZV1li0L7.oZ1lAcCVUAIwzSv3sfiU9umBZuNdFfjJLxYjy70M2yk5FLTvKhPpQ269Rffk2d1RRYyyXbr1ZLnD0' xsystem; \
	useradd -m -s /bin/sh -G admins -p '\$6\$i1vb/PRutU3fEkXm\$8oX2nkmamMxnUwaWjrgAmzxZmPKKLW6xT.Pt87aX2bpq5VxTTIm2kTCgawS18XpMvKD5CNvZ791MgsxN7tvK/1' pmalasek; \
"

# Kompatibilní verze knihoven pro prebuilt xPluto9 binárky
PREFERRED_VERSION_fmt = "9.1.0"
PREFERRED_VERSION_spdlog = "1.12.0"
PREFERRED_VERSION_cnats = "3.7.0"

# ── Optimalizace bootu ────────────────────────────────────────────────────────

# Bootloader: žádné čekání na výběr menu (0 = okamžitý boot)
UBOOT_EXTLINUX_TIMEOUT = "0"

# Kernel: quiet potlačí výpisy při bootu
APPEND:append = " quiet"

# Zakáž NetworkManager-wait-online - zbytečně zdrží boot o desítky sekund
# Aplikace se mají připojit samy, až bude síť k dispozici
SYSTEMD_AUTO_ENABLE:pn-networkmanager = "enable"
